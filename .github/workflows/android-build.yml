name: Android Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/android/**'
      - 'src/python/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'
  pull_request:
  workflow_dispatch:

jobs:
  # 云端出包：本机没有 Android SDK 时，用它产出可安装的 APK
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 默认不带 native：只需 SDK 即可产出可安装 APK（走纯 Kotlin 封装器）
      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 结构层的回归（Python 参考实现，与 Android 实现互为交叉校验）
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install Pillow
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end self-check
        run: PYTHONPATH=src/python python -m uhdr.cli demo --root .
